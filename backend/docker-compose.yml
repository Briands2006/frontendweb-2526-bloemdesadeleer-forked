services:
  db:
    image: mysql:8.0
    ports:
      - '3309:3306'
    volumes:
      - db_tracker_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: devpwdforbrianandelias
      MYSQL_DATABASE: f1tracker
      MYSQL_USER: devbrihan
      MYSQL_PASSWORD: devpwdforbrianandelias
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '--silent']
      timeout: 30s
      interval: 30s
      retries: 5
      start_period: 30s

volumes:
  db_tracker_data:
